<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圈圈叉叉遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin: 0;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            max-width: 320px;
        }
        .cell {
            background-color: #fff;
            border: 2px solid #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
        }
        .cell.taken {
            cursor: not-allowed;
        }
        .message {
            font-size: 1.5rem;
            margin-top: 20px;
        }
        .restart {
            background-color: #4CAF50;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        .restart:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>圈圈叉叉遊戲</h1>
    <div class="board" id="board"></div>
    <div class="message" id="message">玩家 X 的回合</div>
    <button class="restart" onclick="startGame()">重新開始</button>

    <script>
        const board = document.getElementById('board');
        const message = document.getElementById('message');
        let cells = [];
        let currentPlayer = 'X';

        function startGame() {
            board.innerHTML = '';
            cells = [];
            currentPlayer = 'X';
            message.textContent = `玩家 ${currentPlayer} 的回合`;

            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                board.appendChild(cell);
                cells.push(cell);
            }
        }

        function handleCellClick(e) {
            const cell = e.target;

            if (cell.textContent !== '') return; // 防止重複點擊

            cell.textContent = currentPlayer;
            cell.classList.add('taken');

            if (checkWin()) {
                message.textContent = `玩家 ${currentPlayer} 獲勝！`;
                disableBoard();
            } else if (cells.every(cell => cell.textContent !== '')) {
                message.textContent = '平手！';
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                message.textContent = `玩家 ${currentPlayer} 的回合`;
            }
        }

        function checkWin() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // 橫排
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // 直排
                [0, 4, 8], [2, 4, 6]             // 斜線
            ];

            return winPatterns.some(pattern => {
                const [a, b, c] = pattern;
                return cells[a].textContent &&
                       cells[a].textContent === cells[b].textContent &&
                       cells[a].textContent === cells[c].textContent;
            });
        }

        function disableBoard() {
            cells.forEach(cell => cell.removeEventListener('click', handleCellClick));
        }

        // 初始化遊戲
        startGame();
    </script>
</body>
</html>

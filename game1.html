<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲 1 - 跑酷遊戲</title>
    <link rel="icon" href="images/owl.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #87CEEB;
            margin: 0;
            padding: 0;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-top: 20px;
        }

        #game-info {
            text-align: center;
            color: #333;
            font-size: 20px;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            margin: 20px auto;
            background-color: #f0f0f0;
            border: 2px solid black;
            overflow: hidden;
        }

        #player {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 50px;
            height: 50px;
            background-color: #FF6347;
        }

        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background-color: #228B22;
        }

        #obstacle {
            position: absolute;
            bottom: 50px;
            right: -50px;
            width: 50px;
            height: 50px;
            background-color: #8B0000;
            animation: moveObstacle 3s linear infinite;
        }

        @keyframes moveObstacle {
            0% {
                right: -50px;
            }
            100% {
                right: 850px;
            }
        }

        .button {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>跑酷遊戲</h1>
    <div id="game-info">
        <p>倒數計時: <span id="countdown">30</span> 秒</p>
        <p>分數: <span id="score">0</span></p>
    </div>

    <div id="game-container">
        <div id="player"></div>
        <div id="ground"></div>
        <div id="obstacle"></div>
    </div>
    
    <button class="button" onclick="window.location.href='index.html'">返回首頁</button>
    
    <script>
        const player = document.getElementById('player');
        const obstacle = document.getElementById('obstacle');
        const countdownElement = document.getElementById('countdown');
        const scoreElement = document.getElementById('score');

        let isJumping = false;
        let score = 0;
        let countdown = 30;
        let gameInterval;

        // 控制跳躍
        document.addEventListener('keydown', function(event) {
            if (event.key === ' ' && !isJumping) {
                isJumping = true;
                jump();
            }
        });

        function jump() {
            let jumpHeight = 0;
            const jumpInterval = setInterval(function() {
                if (jumpHeight < 150) {
                    jumpHeight += 10;
                    player.style.bottom = 50 + jumpHeight + 'px';
                } else {
                    clearInterval(jumpInterval);
                    fall();
                }
            }, 20);
        }

        function fall() {
            let fallHeight = 150;
            const fallInterval = setInterval(function() {
                if (fallHeight > 0) {
                    fallHeight -= 10;
                    player.style.bottom = 50 + fallHeight + 'px';
                } else {
                    clearInterval(fallInterval);
                    isJumping = false;
                }
            }, 20);
        }

        // 撞擊檢測
        function checkCollision() {
            const playerRect = player.getBoundingClientRect();
            const obstacleRect = obstacle.getBoundingClientRect();

            if (
                playerRect.left < obstacleRect.right &&
                playerRect.right > obstacleRect.left &&
                playerRect.top < obstacleRect.bottom &&
                playerRect.bottom > obstacleRect.top
            ) {
                alert('遊戲結束！');
                resetGame();
            }
        }

        function resetGame() {
            player.style.bottom = '50px';
            obstacle.style.right = '-50px';
            score = 0;
            scoreElement.textContent = score;
            countdown = 30;
            countdownElement.textContent = countdown;
            clearInterval(gameInterval);
            startGame();
        }

        // 開始遊戲
        function startGame() {
            gameInterval = setInterval(function() {
                countdown--;
                countdownElement.textContent = countdown;
                if (countdown === 0) {
                    alert('時間到，遊戲結束！');
                    resetGame();
                }
            }, 1000);

            gameLoop();
        }

        // 遊戲主循環
        function gameLoop() {
            checkCollision();
            score++;
            scoreElement.textContent = score;
            requestAnimationFrame(gameLoop);
        }

        // 開始遊戲
        startGame();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日卡片</title>
    <div id="container">
  <p id="strings">🎂</p>
  
  <div id="letter" class="hidden">
    <div class="envelope">
      <div class="content">
        <h3>前言 💩</h3>
        <p>欸!    這次用 AI  寫了程式當卡片送你，屌吧! <br>不過你要先闖完所有關卡才能<br>看到卡片內容和禮物密語。      <br>甘巴爹٩( ˵ᐛ ˵)۶</p>
				<button id="game-btn">進入遊戲 🎮</button>
      </div>
    </div>
  </div>
</div>
    <style>
        /* 這裡放 CSS 樣式 */
      @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@552&display=swap");

body {
	height: 100vh;
	margin: 0;
	display: grid;
	place-items: center;
	background: #f0f8ff; /* 輕柔的藍 */
	font-family: "Caveat", sans-serif;
}

#strings {
	font-size: 8rem;
	cursor: pointer;
	animation: bounce 2s infinite ease-in-out;
	transition: transform 0.3s;
}

#strings:hover {
	transform: scale(1.1); /* 懸停時稍微放大 */
}

/* 信封樣式 */
#letter {
	background: white;
	padding: 120px;
	border-radius: 12px;
	box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
	max-width: 360px;
	text-align: center;
	border: 2px solid #ddd;
}

.hidden {
	display: none !important;
}

#game-btn {
  margin-top: 20px;
  padding: 10px 25px;
  font-family: "Caveat", sans-serif;
  font-size: 1.5rem;
  background-color: #ffb6c1; /* 粉紅色，很適合生日 */
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

#game-btn:hover {
  background-color: #ff99aa;
  transform: scale(1.1);
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
}

#game-btn:active {
  transform: scale(0.95);
}

@keyframes bounce {
	0%,
	100% {
		transform: translateY(0);
	}
	50% {
		transform: translateY(-30px);
	}
}
    </style>
</head>
<body>



    <script>
        // 這裡放 JavaScript 邏輯
        const paragraph = document.getElementById("strings");
const letter = document.getElementById("letter");
const gameBtn = document.getElementById("game-btn"); // 取得遊戲按鈕

const originalText = "🎂";
const hoverText = "Click it!"; 

// 1. 懸停效果
paragraph.addEventListener("mouseenter", () => {
    paragraph.textContent = hoverText;
});

paragraph.addEventListener("mouseleave", () => {
    paragraph.textContent = originalText;
});

// 2. 點擊進入閱讀信封
paragraph.addEventListener("click", () => {
    paragraph.classList.add("hidden");
    letter.classList.remove("hidden");
});

// 3. 點擊「進入遊戲」按鈕跳轉
gameBtn.addEventListener("click", () => {
    window.location.href = "puzzle_secretwords.html"; 
});
</script> </body>
</body>
</html>

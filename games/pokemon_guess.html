<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢大師評鑑</title>
    <style>
        /* 基本版面配置 */
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #34495e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: all 0.3s ease;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.85em;
            color: #bdc3c7;
            letter-spacing: 1px;
        }

        /* 圖片盒子設定 */
        .image-box {
            background: radial-gradient(circle, #ecf0f1 0%, #bdc3c7 100%);
            border-radius: 12px;
            border: 4px solid #f1c40f;
            margin-bottom: 20px;
            line-height: 0;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            transition: filter 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 題目圖樣式：直接顯示原圖 */
        .silhouette {
            filter: none; /* 移除之前的 brightness(0) */
            transition: transform 0.3s ease;
        }

        .revealed {
            opacity: 1 !important;
        }

        /* 按鈕樣式 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #2ecc71;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 狀態顏色 */
        button.wrong {
            background: #e74c3c !important;
        }

        .next-btn {
            background: #f39c12;
            width: 100%;
            margin-top: 15px;
            font-size: 1.1em;
        }

        .hidden { display: none; }

        #message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 1.5em;
        }

        /* 震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.2s ease-in-out infinite; animation-iteration-count: 2; }
    </style>
</head>
<body>

<div class="container" id="game-card">
    <div class="header-info">
        <span id="level-text">第 1 / 3 題</span>
        <span id="score-text">寶可夢大師評鑑-猜猜我是誰?</span>
    </div>

    <div class="image-box">
        <img id="pokemon-img" src="" alt="Pokemon" class="silhouette">
    </div>

    <div id="options-container" class="options-grid"></div>

    <p id="message"></p>

    <div id="next-area" class="hidden">
        <button class="next-btn" onclick="nextQuestion()">進入下一題</button>
    </div>
</div>

<script>
    // 題庫資料 (在此新增或修改題目)
    const quizData = [
        {
            answer: "皮卡丘",
            options: ["皮卡丘", "雷丘", "鯉魚王", "傑尼龜"],
            silhouette: "https://i.postimg.cc/kGVyz8R5/Gemini-Generated-Image-464txg464txg464t.png",
            revealed: "https://i.postimg.cc/xdMWGFVg/wei-ming-ming-she-ji.png"
        },
        {
            answer: "卡比獸",
            options: ["火焰鳥", "百變怪", "胖丁", "卡比獸"],
            silhouette: "https://i.postimg.cc/FRVD9QhQ/Gemini-Generated-Image-2mla322mla322mla.png", 
            revealed: "https://i.postimg.cc/Df5GQP6N/Gemini-Generated-Image-nupiuanupiuanupi.png"
        },
        {
            answer: "傑尼龜",
            options: ["卡比獸", "傑尼龜", "噴火龍", "喵喵"],
            silhouette: "https://i.postimg.cc/ydpnJy3b/Gemini-Generated-Image-9c9hz69c9hz69c9h.png", 
            revealed: "https://i.postimg.cc/rp89QPSH/Gemini-Generated-Image-k6zpfk6zpfk6zpfk.png"
        }
    ];

    let currentIdx = 0;
    let canClick = true;

    // 初始化每一關
    function initLevel() {
        canClick = true;
        const currentQuiz = quizData[currentIdx];

        // 更新文字
        document.getElementById('level-text').innerText = `第 ${currentIdx + 1} / ${quizData.length} 題`;
        document.getElementById('message').innerText = "";
        
        // 重設圖片
        const img = document.getElementById('pokemon-img');
        img.src = currentQuiz.silhouette;
        img.className = 'silhouette'; // 回到剪影狀態
        
        // 隱藏下一題區域
        document.getElementById('next-area').classList.add('hidden');
        
        // 渲染按鈕
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        currentQuiz.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            container.appendChild(btn);
        });
    }

    // 檢查答案邏輯
    function checkAnswer(selected, btnElement) {
        if (!canClick) return;

        const currentQuiz = quizData[currentIdx];
        const msg = document.getElementById('message');
        const img = document.getElementById('pokemon-img');

        if (selected === currentQuiz.answer) {
            // 答對處理
            canClick = false;
            img.src = currentQuiz.revealed;
            img.className = 'revealed';
            
            msg.innerText = "✅ 唉喲！賽到的吧！";
            msg.style.color = "#2ecc71";
            
            document.getElementById('next-area').classList.remove('hidden');
            
            // 鎖定所有按鈕
            document.querySelectorAll('#options-container button').forEach(b => b.disabled = true);
        } else {
            // 答對處理
            msg.innerText = "❌ 答錯了，寶可夢玩假的！";
            msg.style.color = "#e74c3c";
            btnElement.classList.add('wrong');
            btnElement.disabled = true;
            
            // 震動效果
            const card = document.getElementById('game-card');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);
        }
    }

    // 跳轉下一題
    function nextQuestion() {
        if (currentIdx < quizData.length - 1) {
            currentIdx++;
            initLevel();
        } else {
            // 全破結局
            document.getElementById('game-card').innerHTML = `
                <h2 style="color:#f1c40f">🎉 通過關卡2！</h2>
                <p>虧你玩了這麼多年寶可夢 看樣子你得重練👎</p>
                <button onclick="location.reload()" style="width:100%">進入最後一關</button>
            `;
        }
    }

    // 啟動遊戲
    initLevel();
</script>

</body>
</html>

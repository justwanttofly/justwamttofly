<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文字母鍵盤遊戲</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.8s ease-out;
        }
        #target-letter {
            min-height: 200px;
            transition: background-color 0.1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="game-container bg-white p-6 md:p-10 rounded-xl">
        <!-- 遊戲標題 -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6 border-b-2 pb-2">英文字母鍵盤遊戲</h1>
        
        <!-- 遊戲資訊 -->
        <div class="flex justify-between items-center mb-6 text-lg font-medium text-gray-600">
            <span>得分: <span id="score" class="text-blue-600 font-extrabold">0</span></span>
            <span>最高分: <span id="high-score" class="text-red-500 font-extrabold">0</span></span>
        </div>

        <!-- 目標字母顯示區 -->
        <div id="target-letter" class="flex justify-center items-center bg-indigo-500 text-white rounded-lg select-none shadow-lg">
            <span class="text-9xl font-extrabold tracking-widest leading-none">A</span>
        </div>

        <!-- 遊戲狀態及反饋訊息 -->
        <div id="feedback" class="text-center mt-4 h-6 text-base font-semibold">
            <!-- 訊息將在此顯示 -->
        </div>

        <!-- 說明 -->
        <p class="text-center text-gray-500 mt-6 text-sm">
            提示：當遊戲開始後，請按下鍵盤上對應的字母鍵 (A-Z)。
        </p>

        <!-- 控制按鈕 -->
        <div class="mt-8 flex justify-center space-x-4">
            <button id="start-button" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                開始遊戲
            </button>
            <button id="reset-button" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-full shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                重設最高分
            </button>
        </div>

    </div>

    <script>
        // 遊戲狀態變數
        let score = 0;
        let highScore = localStorage.getItem('alphabetHighScore') ? parseInt(localStorage.getItem('alphabetHighScore')) : 0;
        let targetLetter = '';
        let isPlaying = false;

        // DOM 元素
        const targetLetterDisplay = document.querySelector('#target-letter span');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const feedbackElement = document.getElementById('feedback');
        const startButton = document.getElementById('start-button');
        const resetButton = document.getElementById('reset-button');
        const targetLetterContainer = document.getElementById('target-letter');

        // 更新 UI
        function updateUI() {
            scoreElement.textContent = score;
            highScoreElement.textContent = highScore;
            targetLetterDisplay.textContent = targetLetter;
            
            // 根據遊戲狀態更新開始按鈕文字
            startButton.textContent = isPlaying ? '遊戲中...' : '開始遊戲';
            startButton.disabled = isPlaying;
        }

        // 隨機選擇一個大寫英文字母
        function pickNewLetter() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const randomIndex = Math.floor(Math.random() * letters.length);
            targetLetter = letters[randomIndex];
            updateUI();
        }

        // 顯示反饋訊息
        function displayFeedback(message, type = 'info') {
            let colorClass = '';
            if (type === 'correct') {
                colorClass = 'text-green-600';
            } else if (type === 'incorrect') {
                colorClass = 'text-red-600';
            } else {
                colorClass = 'text-gray-700';
            }
            feedbackElement.className = `text-center mt-4 h-6 text-base font-semibold ${colorClass}`;
            feedbackElement.textContent = message;
            
            // 暫時修改背景顏色以提供視覺反饋
            if (type === 'correct') {
                targetLetterContainer.classList.add('bg-green-400', 'ring-4', 'ring-green-300');
            } else if (type === 'incorrect') {
                targetLetterContainer.classList.add('bg-red-400', 'ring-4', 'ring-red-300');
            }

            // 清除反饋和顏色
            setTimeout(() => {
                feedbackElement.textContent = '';
                targetLetterContainer.classList.remove('bg-green-400', 'ring-4', 'ring-green-300', 'bg-red-400', 'ring-4', 'ring-red-300');
                if (isPlaying) {
                    targetLetterContainer.classList.add('bg-indigo-500');
                } else {
                    targetLetterContainer.classList.add('bg-gray-500');
                }
            }, 300);
            
            // 確保在清除後恢復到初始顏色 (只在遊戲進行中)
            if (isPlaying) {
                targetLetterContainer.classList.add('bg-indigo-500');
            }
        }

        // 處理鍵盤按鍵事件
        function handleKeyPress(event) {
            if (!isPlaying) return;

            // 獲取按鍵，並轉換為大寫
            const pressedKey = event.key.toUpperCase();
            
            // 檢查是否為單個字母 (A-Z)
            if (pressedKey.length === 1 && pressedKey >= 'A' && pressedKey <= 'Z') {
                if (pressedKey === targetLetter) {
                    // 正確
                    score++;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('alphabetHighScore', highScore);
                    }
                    displayFeedback('正確！', 'correct');
                    pickNewLetter();
                } else {
                    // 錯誤
                    displayFeedback(`錯誤！您按下了 ${pressedKey}，應為 ${targetLetter}`, 'incorrect');
                    score = 0; // 錯誤重置分數
                    // 不重新選擇字母，讓使用者有機會看到正確的字母
                    setTimeout(() => updateUI(), 300); // 確保在清除反饋後更新分數
                }
            }
            // 阻止瀏覽器處理某些按鍵的預設行為 (例如空格鍵捲動)
            event.preventDefault(); 
        }

        // 開始遊戲
        function startGame() {
            if (isPlaying) return;

            isPlaying = true;
            score = 0;
            targetLetterContainer.classList.remove('bg-gray-500'); // 移除初始的灰色背景
            targetLetterContainer.classList.add('bg-indigo-500'); // 設置遊戲中的背景
            displayFeedback('開始！請按下字母鍵...', 'info');
            pickNewLetter(); // 選擇第一個字母
            updateUI();
        }

        // 重設最高分
        function resetHighScore() {
            // 使用自定義模態框代替 alert()
            const confirmReset = window.confirm("您確定要重設最高分嗎？"); 
            if (confirmReset) {
                highScore = 0;
                localStorage.setItem('alphabetHighScore', 0);
                updateUI();
                displayFeedback('最高分已重設為 0', 'info');
            }
        }

        // 初始化設定
        window.onload = function() {
            updateUI();
            // 初始狀態顯示問號或起始字母 A
            targetLetter = 'A'; 
            targetLetterContainer.classList.add('bg-gray-500'); // 初始狀態的灰色背景
            updateUI();
            displayFeedback('點擊「開始遊戲」按鈕來啟動遊戲。', 'info');

            // 添加事件監聽器
            startButton.addEventListener('click', startGame);
            resetButton.addEventListener('click', resetHighScore);
            document.addEventListener('keydown', handleKeyPress);
        };
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant"> 
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グルグルの世界</title>
    <link rel="icon" href="images/owl.ico" type="image/x-icon">
    <!-- 載入 Google Fonts 的粉圓體 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Jf+Open+Huninn&display=swap" rel="stylesheet">

    <style>
        
        body {
            font-family: "Jf Open Huninn", Arial, sans-serif;
            background-image: url('images/green-grass-background_.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: -1;
        }

        .header-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            width: 70%;
            justify-content: space-between;
        }

        .header-container img {
            width: 50px;
            height: auto;
            margin-right: 10px;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-left: 10px;
            white-space: nowrap;
        }

        .navbar {
            display: flex;
            gap: 20px;
            position: relative;
            align-items: center;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: #4CAF50;
            color: white;
        }
        .dropdown {
    position: relative;
    display: inline-block;
        }
        .dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 160px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    z-index: 999;
    border-radius: 8px;
    top: 100%;
    left: 0;
        }

.dropdown-content a {
    color: #333;
    padding: 10px 16px;
    text-decoration: none;
    display: block;
    font-size: 14px;
    white-space: nowrap;
       }

.dropdown-content a:hover {
    background-color: #4CAF50;
    color: white;
       }

.dropdown:hover .dropdown-content {
    display: block;
       }

        .designer-link {
            text-align: center;
            font-size: 14px;
            color: #4CAF50;
            margin-top: 10px;
        }

        .designer-link a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }

        .designer-link a:hover {
            color: #45a049;
            text-decoration: underline;
        }

        footer {
            position: absolute;
            bottom: 10px;
            text-align: center;
            width: 100%;
            color: #fff;
            padding-bottom: 20px;
        }

        #game1 {
    display: none;
    margin-top: 150px;
    text-align: center;
}

    </style>
</head>
<body>

    <div class="header-container">
        <img src="images/owl.ico" alt="Logo">
        <div class="site-title">グルグルの世界</div>
        <div class="navbar">
            <a href="#home">首頁</a>
             <div class="dropdown">
                <a href="#games">遊戲</a>
                <div class="dropdown-content">
                    <a href="games/alphabet.html">英文字母快打遊戲</a>
                    <a href="games/birthdaycard.html">小驚喜J</a>
                    <a href="Solo/gina_card.html">小驚喜G</a>
                </div>
            </div>
            <a href="#travel">旅行</a>
            <a href="#about">關於我們</a>
            <a href="#contact">聯繫我們</a>
        </div>
    </div>
    
    <footer>
        <p>© 2026 個人網站 - 所有權利保留</p>
    </footer>


    
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グルグルの世界</title>
    <link rel="icon" href="images/owl.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('images/green-grass-background_.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: -1;
        }

        .header-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            width: 70%;
            justify-content: space-between;
        }

        .header-container img {
            width: 50px;
            height: auto;
            margin-right: 10px;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-left: 10px;
            white-space: nowrap;
        }

        .navbar {
            display: flex;
            gap: 20px;
            position: relative;
            align-items: center;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: #4CAF50;
            color: white;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(255, 255, 255, 0.9);
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #4CAF50;
            color: white;
        }

        .canva-embed-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            margin-top: 100px;
            margin-bottom: 50px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);
        }

        .canva-embed-container .aspect-ratio-box {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.2225%;
        }

        .canva-embed-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
        }

        .designer-link {
            text-align: center;
            font-size: 14px;
            color: #4CAF50;
            margin-top: 10px;
        }

        .designer-link a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }

        .designer-link a:hover {
            color: #45a049;
            text-decoration: underline;
        }

        footer {
            position: absolute;
            bottom: 10px;
            text-align: center;
            width: 100%;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="images/owl.ico" alt="Logo">
        <div class="site-title">グルグルの世界</div>
        <div class="navbar">
            <a href="#home">首頁</a>
            <a href="#about">關於我們</a>
            <div class="dropdown">
                <a href="#">🎮 遊戲</a>
                <div class="dropdown-content">
                    <a href="game1.html">遊戲 1</a>
                    <a href="game2.html">遊戲 2</a>
                    <a href="game3.html">遊戲 3</a>
                    <a href="game4.html">遊戲 4</a>
                </div>
            </div>
            <a href="#contact">聯繫我們</a>
        </div>
    </div>

    <div class="canva-embed-container">
        <div class="aspect-ratio-box">
            <iframe loading="lazy" src="https://www.canva.com/design/DAGibJ-kMZs/KKvkycmDfjYDtuV6yx6nbA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
        </div>
        <p class="designer-link">動畫設計者：<a href="https://www.canva.com/design/DAGibJ-kMZs/KKvkycmDfjYDtuV6yx6nbA/view?utm_content=DAGibJ-kMZs&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" rel="noopener">點此欣賞完整設計</a></p>
    </div>

    <footer>
        <p>© 2025 遊戲網站 - 所有權利保留</p>
    </footer>
</body>
</html>

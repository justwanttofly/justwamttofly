<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グルグルの世界</title>
    <link rel="icon" href="images/owl.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('images/green-grass-background_.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: -1;
        }

        .header-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            width: 70%;
            justify-content: space-between;
        }

        .header-container img {
            width: 50px;
            height: auto;
            margin-right: 10px;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-left: 10px;
            white-space: nowrap;
        }

        .navbar {
            display: flex;
            gap: 20px;
            position: relative;
            align-items: center;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: #4CAF50;
            color: white;
        }
        .dropdown {
    position: relative;
    display: inline-block;
        }
        .dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 160px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    z-index: 999;
    border-radius: 8px;
    top: 100%;
    left: 0;
        }

.dropdown-content a {
    color: #333;
    padding: 10px 16px;
    text-decoration: none;
    display: block;
    font-size: 14px;
    white-space: nowrap;
       }

.dropdown-content a:hover {
    background-color: #4CAF50;
    color: white;
       }

.dropdown:hover .dropdown-content {
    display: block;
       }

        .designer-link {
            text-align: center;
            font-size: 14px;
            color: #4CAF50;
            margin-top: 10px;
        }

        .designer-link a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }

        .designer-link a:hover {
            color: #45a049;
            text-decoration: underline;
        }

        footer {
            position: absolute;
            bottom: 10px;
            text-align: center;
            width: 100%;
            color: #fff;
            padding-bottom: 20px;
        }

        #game1 {
    display: none;
    margin-top: 150px;
    text-align: center;
}

    </style>
</head>
<body>

    <div class="header-container">
        <img src="images/owl.ico" alt="Logo">
        <div class="site-title">グルグルの世界</div>
        <div class="navbar">
            <a href="#home">首頁</a>
             <div class="dropdown">
                <a href="#games">遊戲</a>
                <div class="dropdown-content">
                    <a href="#game1">小雞收集大便</a>
                    <a href="#game2">圈圈叉叉</a>
                    <a href="#game3">其他遊戲</a>
                </div>
            </div>
            <a href="#travel">旅行</a>
            <a href="#about">關於我們</a>
            <a href="#contact">聯繫我們</a>
        </div>
    </div>

    <div id="game1">
        <h2>🐤 小雞收集大便</h2>
        <canvas id="poopGameCanvas" width="500" height="500"></canvas><br>
        <button onclick="startGame()">開始遊戲</button>
        <p id="scoreDisplay">得分：0</p>
    </div>

    <footer>
        <p>© 2025 遊戲網站 - 所有權利保留</p>
    </footer>

    <script>
  
        document.addEventListener('click', function (e) {
    if (e.target.matches('a[href="#game1"]')) {
        document.querySelectorAll('div[id^="game"]').forEach(div => div.style.display = 'none');
        document.getElementById('game1').style.display = 'block';
    }
});


        let canvas = document.getElementById('poopGameCanvas');
        let ctx = canvas.getContext('2d');

        let chicken = { x: 220, y: 450, width: 50, height: 50 };
        let poop = { x: Math.random() * 450, y: 0, width: 30, height: 30 };
        let score = 0;
        let gameInterval;

        function drawChicken() {
            ctx.fillStyle = 'yellow';
            ctx.fillRect(chicken.x, chicken.y, chicken.width, chicken.height);
        }

        function drawPoop() {
            ctx.fillStyle = 'brown';
            ctx.fillRect(poop.x, poop.y, poop.width, poop.height);
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawChicken();
            drawPoop();

            poop.y += 5;
            if (poop.y > 500) {
                poop.y = 0;
                poop.x = Math.random() * 450;
            }

            // 判斷是否接到
            if (poop.y + poop.height > chicken.y &&
                poop.x < chicken.x + chicken.width &&
                poop.x + poop.width > chicken.x) {
                score++;
                document.getElementById('scoreDisplay').innerText = '得分：' + score;
                poop.y = 0;
                poop.x = Math.random() * 450;
            }
        }

        function startGame() {
            score = 0;
            poop.y = 0;
            poop.x = Math.random() * 450;
            document.getElementById('scoreDisplay').innerText = '得分：0';
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 30);
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft' && chicken.x > 0) {
                chicken.x -= 20;
            }
            if (e.key === 'ArrowRight' && chicken.x < 450) {
                chicken.x += 20;
            }
        });
    </script>
    
</body>
</html>

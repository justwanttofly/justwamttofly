<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グルグルの世界</title>
    <link rel="icon" href="images/owl.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('images/green-grass-background_.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

           
            position: relative; 
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: -1;
        }

        .navbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-around;
            width: 60%;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: #4CAF50;
            color: white;
        }

        header {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
        }

        header img {
            width: 50px;
            height: auto;
            margin-right: 10px;
        }

        header h1 {
            color: #333;
            font-size: 24px;
            margin: 0;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #45a049;
        }

        footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#home">首頁</a>
        <a href="#games">遊戲</a> 
        <a href="#about">關於我們</a>
        <a href="#contact">聯繫我們</a>
    </div>

    <header>
        <img src="images/owl.ico" alt="Logo">
        <h1>グルグルの世界</h1>
    </header>

    <h1>歡迎來到遊戲網站！</h1>
    <p>選擇您想玩的遊戲：</p>

    <button class="button" onclick="window.location.href='game1.html'">遊戲 1</button>
    <button class="button" onclick="window.location.href='game2.html'">遊戲 2</button>
    <button class="button" onclick="window.location.href='game3.html'">遊戲 3</button>
    <button class="button" onclick="window.location.href='game4.html'">遊戲 4</button>

    <footer>
        <p>© 2025 遊戲網站 - 所有權利保留</p>
    </footer>
</body>
</html>

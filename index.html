<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グルグルの世界</title>
    <link rel="icon" href="images/owl.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('images/green-grass-background_.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 新增的部分: header 元素樣式 */
        header {
            position: absolute; /* 使 header 元素固定在頁面左上角 */
            top: 20px; /* 距離頁面上方 20px */
            left: 20px; /* 距離頁面左邊 20px */
            display: flex; /* 使用 flex 排版 */
            align-items: center; /* 使 LOGO 和網站名稱垂直對齊 */
        }

        header img {
            width: 50px; /* 調整 LOGO 大小 */
            height: auto; /* 高度自動縮放 */
            margin-right: 10px; /* LOGO 和網站名稱之間的間隔 */
        }

        header h1 {
            color: #333; /* 設定網站名稱的顏色 */
            font-size: 24px; /* 設定網站名稱的字體大小 */
            margin: 0; /* 移除 h1 元素的外邊距 */
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #45a049;
        }

        footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- 新增的 header 部分 -->
    <header>
        <img src="images/owl.ico" alt="Logo">
        <h1>グルグルの世界</h1>
    </header>

    <h1>歡迎來到遊戲網站！</h1>
    <p>選擇您想玩的遊戲：</p>
    
    <button class="button" onclick="window.location.href='game1.html'">遊戲 1</button>
    <button class="button" onclick="window.location.href='game2.html'">遊戲 2</button>
    <button class="button" onclick="window.location.href='game3.html'">遊戲 3</button>
    <button class="button" onclick="window.location.href='game3.html'">遊戲 4</button>
    
    <footer>
        <p>© 2025 遊戲網站 - 所有權利保留</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的遊戲網站</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #4CAF50;
            font-size: 3em;
        }

        p {
            font-size: 1.2em;
        }

        #clickButton {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #clickButton:hover {
            background-color: #45a049;
        }

        #score {
            font-size: 1.5em;
            font-weight: bold;
            color: #FF5722;
        }

        footer {
            margin-top: 50px;
            font-size: 1em;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>歡迎來到我的遊戲網站！</h1>
    <p>點擊下面的按鈕來增加分數！</p>
    <button id="clickButton">點擊我！</button>
    <p>你的分數是：<span id="score">0</span></p>

    <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グルグルの世界</title>
    <link rel="icon" href="images/owl.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('images/green-grass-background_.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: -1;
        }

        /* 整合 LOGO + 導覽列的框框 */
        .header-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            width: 70%; /* 擴大寬度 */
            justify-content: space-between;
        }

        .header-container img {
            width: 50px;
            height: auto;
            margin-right: 10px;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-left: 10px;
            white-space: nowrap;
            display: inline-block;
        }

        .navbar {
            display: flex;
            gap: 20px;
            position: relative;
            align-items: center; /* 讓所有選項垂直對齊 */
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
            display: inline-block; /* 保證文字不會換行 */
        }

        .navbar a:hover {
            background-color: #4CAF50;
            color: white;
        }

        /* 新增下拉選單樣式 */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(255, 255, 255, 0.9);
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 999;
            border-radius: 5px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #4CAF50;
            color: white;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #45a049;
        }
          .canva-embed-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            margin-top: 150px;
            margin-bottom: 50px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);
            z-index: 0;
        }

        .canva-embed-container .aspect-ratio-box {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.2225%;
        }

        .canva-embed-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }

        footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 整合 LOGO + 整理框的區域 -->
    <div class="header-container">
        <img src="images/owl.ico" alt="Logo">
        <div class="site-title">グルグルの世界</div>
        <div class="navbar">
            <a href="#home">首頁</a>
            <a href="#about">關於我們</a>
            <!-- 添加下拉選單 -->
            <div class="dropdown">
                <a href="#">🎮 遊戲</a>
                <div class="dropdown-content">
                    <a href="game1.html">遊戲 1</a>
                    <a href="game2.html">遊戲 2</a>
                    <a href="game3.html">遊戲 3</a>
                    <a href="game4.html">遊戲 4</a>
                </div>
            </div>
            <a href="#contact">聯繫我們</a>
        </div>
    </div>
 <div class="canva-embed-container">
        <div class="aspect-ratio-box">
            <iframe loading="lazy" src="https://www.canva.com/design/DAGibJ-kMZs/KKvkycmDfjYDtuV6yx6nbA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
        </div>
    </div>
    <a href="https://www.canva.com/design/DAGibJ-kMZs/KKvkycmDfjYDtuV6yx6nbA/view?utm_content=DAGibJ-kMZs&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" rel="noopener">設計者</a>
    <!-- 🔹 新增部分結束 -->

    <footer>
        <p>© 2025 遊戲網站 - 所有權利保留</p>
    </footer>
</body>
</html>

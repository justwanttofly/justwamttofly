<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小雞收集大便遊戲</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f8ff;
            margin: 0;
        }

        canvas {
            border: 2px solid #333;
            background-color: #e0f7fa;
        }

        .info {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin: 10px 0;
            font-size: 1.5rem;
        }

        .game-over {
            font-size: 2rem;
            color: red;
            margin-top: 20px;
            display: none;
        }

        .start-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.5rem;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
        }

        .start-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>🐥 小雞收集大便 💩</h1>
    <div class="info">
        <div class="score" id="score">分數：0</div>
        <div class="timer" id="timer">時間：30 秒</div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="game-over" id="gameOver">遊戲結束！</div>
    <button class="start-button" id="startButton" onclick="startGame()">開始遊戲</button>

    <!-- 音效 -->
    <audio id="bgMusic" loop>
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>

    <audio id="scoreSound">
        <source src="score-sound.mp3" type="audio/mpeg">
    </audio>

    <audio id="gameOverSound">
        <source src="game-over-sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const chicken = { x: 200, y: 350, width: 40, height: 40, speed: 5 };
        const poop = { x: Math.random() * 360, y: 0, width: 30, height: 30, speed: 3 };

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;

        const bgMusic = document.getElementById('bgMusic');
        const scoreSound = document.getElementById('scoreSound');
        const gameOverSound = document.getElementById('gameOverSound');

        function drawChicken() {
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(chicken.x, chicken.y, chicken.width, chicken.height);
        }

        function drawPoop() {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(poop.x, poop.y, poop.width, poop.height);
        }

        function movePoop() {
            poop.y += poop.speed;
            if (poop.y > canvas.height) {
                poop.y = 0;
                poop.x = Math.random() * 360;
            }
        }

        function checkCollision() {
            if (
                chicken.x < poop.x + poop.width &&
                chicken.x + chicken.width > poop.x &&
                chicken.y < poop.y + poop.height &&
                chicken.y + chicken.height > poop.y
            ) {
                score++;
                scoreSound.play();  // 接住大便時播放音效
                document.getElementById('score').textContent = `分數：${score}`;
                poop.y = 0;
                poop.x = Math.random() * 360;
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawChicken();
            drawPoop();

            movePoop();
            checkCollision();

            requestAnimationFrame(gameLoop);
        }

        function startTimer() {
            const timerElement = document.getElementById('timer');

            const countdown = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    timerElement.textContent = `時間：${timeLeft} 秒`;
                } else {
                    clearInterval(countdown);
                    gameActive = false;
                    document.getElementById('gameOver').style.display = 'block';
                    gameOverSound.play(); // 遊戲結束音效
                    bgMusic.pause();      // 停止背景音樂
                }
            }, 1000);
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;

            document.getElementById('score').textContent = `分數：${score}`;
            document.getElementById('timer').textContent = `時間：${timeLeft} 秒`;
            document.getElementById('gameOver').style.display = 'none';

            bgMusic.currentTime = 0;  // 重置音樂
            bgMusic.play();

            gameLoop();
            startTimer();
        }

        window.addEventListener('keydown', function (e) {
            if (!gameActive) return;

            if (e.key === 'ArrowLeft' && chicken.x > 0) {
                chicken.x -= chicken.speed;
            } else if (e.key === 'ArrowRight' && chicken.x < canvas.width - chicken.width) {
                chicken.x += chicken.speed;
            }
        });
    </script>
</body>
</html>
